["package"]
"name" = "spitzli-mail"
"version" = "0.3.0"
"edition" = "2024"
"rust-version" = "1.94"
"license" = "AGPL-3.0-only"
"publish" = false

["workspace"]

["dependencies"]
"async-trait" = "0.1"
"base64" = "0.22"
"sha2" = "0.10"
"rustls-pemfile" = "2"
"axum" = "0.8"
"ed25519-dalek" = "2"
"hex" = "0.4"
"url" = "2"
"hickory-resolver" = "0.25"
"rcgen" = "0.14"

["dependencies"."tokio-stream"]
"version" = "0.1"
"features" = ["net"]

["dependencies"."spitzli-mail-runtime"]
"git" = "https://github.com/spitzli/cloud-plugin-sdk"
"rev" = "8019f3df67dba3fed3083f22635e4725028c1b5e"
"package" = "spitzli-mail-runtime"

["dependencies"."spitzli-mail-protocol"]
"git" = "https://github.com/spitzli/cloud-plugin-sdk"
"rev" = "8019f3df67dba3fed3083f22635e4725028c1b5e"
"package" = "spitzli-mail-protocol"

["dependencies"."spitzli-mail-message"]
"git" = "https://github.com/spitzli/cloud-plugin-sdk"
"rev" = "8019f3df67dba3fed3083f22635e4725028c1b5e"
"package" = "spitzli-mail-message"

["dependencies"."serde"]
"version" = "1"
"features" = ["derive"]

["dependencies"."serde_json"]
"version" = "1"
"features" = ["arbitrary_precision"]

["dependencies"."tokio"]
"version" = "1"
"features" = ["macros", "rt-multi-thread", "signal", "time"]

["dependencies"."spitzli-plugin-protocol"]
"git" = "https://github.com/spitzli/cloud-plugin-sdk"
"rev" = "8019f3df67dba3fed3083f22635e4725028c1b5e"
"package" = "spitzli-plugin-protocol"

["dependencies"."spitzli-plugin-runtime"]
"git" = "https://github.com/spitzli/cloud-plugin-sdk"
"rev" = "8019f3df67dba3fed3083f22635e4725028c1b5e"
"package" = "spitzli-plugin-runtime"

["dependencies"."spitzli-plugin-kit"]
"git" = "https://github.com/spitzli/cloud-plugin-sdk"
"rev" = "8019f3df67dba3fed3083f22635e4725028c1b5e"
"package" = "spitzli-plugin-kit"

["dependencies"."tonic"]
"version" = "0.14.6"
"features" = ["transport"]

["dependencies"."uuid"]
"version" = "1"
"features" = ["v4"]

["dependencies"."tokio-postgres"]
"version" = "0.7"
"features" = ["with-uuid-1"]

["dependencies"."reqwest"]
"version" = "0.12"
"default-features" = false
"features" = ["rustls-tls", "json", "stream"]

["dev-dependencies"]
"http-body-util" = "0.1"
"tempfile" = "3"

["dev-dependencies"."tower"]
"version" = "0.5"
"features" = ["util"]

["lints"]

["lints"."rust"]
"unsafe_op_in_unsafe_fn" = "deny"
"unused_must_use" = "deny"
"unfulfilled_lint_expectations" = "deny"

["lints"."clippy"]
"allow_attributes_without_reason" = "deny"
"as_ptr_cast_mut" = "deny"
"await_holding_lock" = "deny"
"await_holding_refcell_ref" = "deny"
"cast_lossless" = "deny"
"checked_conversions" = "deny"
"dbg_macro" = "deny"
"excessive_nesting" = "deny"
"exit" = "deny"
"fallible_impl_from" = "deny"
"implicit_clone" = "deny"
"let_underscore_future" = "deny"
"lossy_float_literal" = "deny"
"manual_assert" = "deny"
"manual_let_else" = "deny"
"match_wildcard_for_single_variants" = "deny"
"mem_forget" = "deny"
"mut_mut" = "deny"
"needless_continue" = "deny"
"needless_pass_by_ref_mut" = "deny"
"option_option" = "deny"
"rc_mutex" = "deny"
"redundant_else" = "deny"
"ref_option_ref" = "deny"
"todo" = "deny"
"unchecked_time_subtraction" = "deny"
"undocumented_unsafe_blocks" = "deny"
"unimplemented" = "deny"
"unnecessary_box_returns" = "deny"
"unnecessary_safety_comment" = "deny"
"unnecessary_safety_doc" = "deny"
"unnested_or_patterns" = "deny"

["lints"."clippy"."correctness"]
"level" = "deny"
"priority" = -1

["lints"."clippy"."suspicious"]
"level" = "deny"
"priority" = -1

["lints"."clippy"."complexity"]
"level" = "deny"
"priority" = -1

["lints"."clippy"."perf"]
"level" = "deny"
"priority" = -1

["lints"."clippy"."style"]
"level" = "deny"
"priority" = -1
